<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>trellis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Trellis, a comonadic terminal spreadsheet, running in the browser via WebAssembly.">
  <style>
    html, body {
      background: #111;
      margin: 0;
      height: 100%;
      overflow: hidden; /* the sheet fills the viewport - nothing here should scroll */
      font-family: monospace;
      color: #ccc;
    }
    trellis-sheet { display: block; }
    /* A thin, unobtrusive overlay rather than a header competing for
       layout space - the sheet itself is the whole page. */
    #chrome {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 4px 8px;
      font-size: 12px;
      background: rgba(17, 17, 17, 0.75);
      pointer-events: none; /* never steals a click/tap meant for the sheet underneath */
      z-index: 1;
    }
    #chrome a { color: #6cf; pointer-events: auto; }
    #status { color: #6f6; }
  </style>
</head>
<body>
  <div id="chrome">
    trellis - <a href="https://github.com/gatlin/trellis">source</a> -
    <span id="status">loading&hellip;</span>
  </div>
  <trellis-sheet id="sheet"></trellis-sheet>
  <script type="module">
    import "./trellis-sheet.js";

    const sheet = document.getElementById("sheet");
    const status = document.getElementById("status");
    sheet.addEventListener("ready", () => { status.textContent = "running"; });
  </script>
</body>
</html>
